# One real run of each mode against binance.com, daily. tests.yml
# (deliberately) never touches the site.
#
# No secrets are needed, and that is the point of running it: the README's
# central claim is "no key, no proxy, no account", and an ungated scheduled
# canary is that sentence under test every morning (CLAUDE.md §21, §24). All
# three data endpoints answered a datacentre address normally when this repo
# was written (2026-09-24); a GitHub runner is a datacentre address too.
#
# Measured on its first dispatch (2026-09-24): a GitHub-hosted runner with
# no proxy was served in all three modes (60 of 238 adverts, 90 of 8,917
# portfolios, 150 of 2,269 announcements, all complete). The runner's region
# was not checked. If a later run is refused for its address, set the proxy
# secret (an exit in a country Binance serves) and the canary uses it with
# no edit here:
#
#     gh secret set BINANCE_PROXY --repo 2scraper/binance-scraper
#
# It goes through the ENVIRONMENT, not a --proxy line: env_config.py reads
# exactly that variable, an unset secret arrives as an empty string which the
# loader treats as unset, and the credential never reaches a command line.

name: canary

on:
  schedule:
    # 05:40 UTC. Not on the hour: every scheduled workflow fires at :00.
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # USDT/EUR had ~190-200 adverts on 2026-09-24, so three pages of 20
          # are full; the floor leaves room for a thin morning.
          - mode: p2p
            args: "--asset USDT --fiat EUR --side buy"
            floor: 40
          - mode: copytrading
            args: "--mode copytrading --time-range 30D --sort-by roi"
            floor: 60
          - mode: announcements
            args: "--mode announcements --category new-listings"
            floor: 100
    env:
      BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chromium

      # >= 3 pages, because with one page pagination is never exercised (§11).
      - name: Run
        id: run
        run: |
          set +e   # `run:` is `bash -e`; without this a non-zero exit aborts
                   # the step before the echo below records it.
          python playwright_scraper.py ${{ matrix.args }} --pages 3 \
            --out canary --format both --dump-html canary_dump.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Interpret
        run: |
          code="${{ steps.run.outputs.exit_code }}"
          echo "exit code: $code"
          case "$code" in
            0) ;;
            3) echo "::error::Blocked. If the log names aws-waf, the WAF has moved in front of the data endpoints, which is the README's central claim failing. If it names http-403 or geo-451, the runner's address was refused: set the BINANCE_PROXY secret (see the header)."; exit 1 ;;
            4) echo "::error::Zero rows from a listing that is never empty. The endpoint's shape has moved; see canary_dump.json."; exit 1 ;;
            5) echo "::error::The data never arrived, or the endpoint REFUSED the parameters (the log names the site's own complaint)."; exit 1 ;;
            *) echo "::error::Unexpected exit $code."; exit 1 ;;
          esac

      - name: Assert
        run: |
          python - <<'EOF'
          import json, sys
          meta = json.load(open("canary.meta.json"))
          rows = json.load(open("canary.json"))
          mode, floor = "${{ matrix.mode }}", ${{ matrix.floor }}
          problems = []
          if meta["status"] != "complete":
              problems.append("status %r (%s)" % (meta["status"], meta["stop_reason"]))
          if meta["pages_completed"] != 3:
              problems.append("pages_completed %r, not 3" % meta["pages_completed"])
          if len(rows) < floor:
              problems.append("%d rows, floor %d" % (len(rows), floor))
          if not meta.get("total_results"):
              problems.append("no total_results in the sidecar")
          if {r["mode"] for r in rows} != {mode}:
              problems.append("rows name modes %r" % {r["mode"] for r in rows})
          pairs = [(r["page"], r["position"]) for r in rows]
          if len(set(pairs)) != len(pairs):
              problems.append("page+position is not unique")
          if mode == "p2p":
              priced = sum(1 for r in rows if isinstance(r["price"], float))
              if priced != len(rows):
                  problems.append("%d of %d rows have a price" % (priced, len(rows)))
              if {r["advertiser_side"] for r in rows} != {"sell"}:
                  problems.append("a buy query's adverts are not all 'sell': %r"
                                  % {r["advertiser_side"] for r in rows})
          if mode == "copytrading":
              if any(r["roi_pct"] is None for r in rows):
                  problems.append("a portfolio without ROI")
          if mode == "announcements":
              bad = [r["url"] for r in rows if "/support/announcement/detail/" not in r["url"]]
              if bad:
                  problems.append("non-canonical url: %s" % bad[0])
          if problems:
              print("canary FAILED: " + "; ".join(problems))
              sys.exit(1)
          print("canary OK: %d %s rows of %s, complete" % (len(rows), mode, meta["total_results"]))
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-${{ matrix.mode }}
          path: |
            canary.json
            canary.csv
            canary.meta.json
            canary_dump.json*
            canary_page*_debug.html
          if-no-files-found: ignore
