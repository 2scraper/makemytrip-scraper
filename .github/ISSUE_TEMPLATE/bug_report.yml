name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw HTML dumps and the Scraper
        API's `x-debug` header do not. Replace them with `***`.

        A few things answer most reports faster than we can:

        - **Exit 3 from a US address?** Binance's terms exclude some
          jurisdictions, the United States among them (binance.us is a
          separate exchange). Try an exit elsewhere, and say in the report
          what the sidecar's `stop_reason` was: this repo has not measured
          what such an address is answered with.
        - **Exit 3 with `blocked_aws-waf`?** The site's AWS WAF challenged
          the session. The data endpoints were not gated when this repo was
          written, so this is news worth reporting, together with the exit
          you used. A residential `--proxy`, or `TWOCAPTCHA_KEY` for the WAF's
          CAPTCHA (AmazonTask), are the two answers.
        - **Exit 4, zero rows?** The query may genuinely match nothing, for
          example a P2P market with no adverts for that payment method. That is
          a correct answer. See
          [TROUBLESHOOTING.md](../blob/main/TROUBLESHOOTING.md).
        - **Every advert says `sell` on a buy query?** That is the site's
          own convention: an advert carries the maker's side. `side` says
          what you asked for; `advertiser_side` is the advert's.

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - scraper_api_client.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - No browser (scraper_api_client.py over plain HTTP)
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things: 3 is a
        refusal (WAF, 403 or 451), 4 is "ran fine, found nothing", 5 is "the
        data never arrived". The table is in the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py \
          --asset USDT --fiat EUR --side buy \
          --pages 3 --out usdt_eur
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        60 adverts over 3 pages, as the site shows ~200 for USDT/EUR.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|beautifulsoup4|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true
