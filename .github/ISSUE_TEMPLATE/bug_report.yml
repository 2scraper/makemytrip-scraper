name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw HTML dumps and the Scraper
        API's `x-debug` header do not. Replace them with `***`.

        A few things answer most reports faster than we can:

        - **Exit 3 with `blocked_akamai` or `blocked_akamai-reset`?** From a
          datacentre address that is the expected answer: Akamai refused
          every client measured on 2026-09-24, real Chromium included. What
          was measured to work is the Scraping Browser API with a
          `country-in` profile (`--cdp-endpoint`). Say in the report which
          exit you used and what the sidecar's `stop_reason` was.
        - **Exit 5 naming HTTP 401?** The Scraping Browser profile expired;
          its credentials last about a day.
        - **Exit 4, zero rows?** The site answered "No Hotels Found" for
          that city and those dates. That is a correct answer. See
          [TROUBLESHOOTING.md](../blob/main/TROUBLESHOOTING.md).
        - **Hotels from another town?** A wrong city code is answered with
          the site's substitutes; those rows carry a `section` other than
          `RECOMMENDED_HOTELS`. Pass `--city` by name.
        - **Prices in INR for Dubai?** That is the site: prices are per
          night in INR whatever the city.

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - scraper_api_client.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - No browser (scraper_api_client.py over plain HTTP)
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things: 3 is a
        refusal (Akamai's Access Denied, its dropped connection or its
        `200-OK` decoy), 4 is "ran fine, found nothing", 5 is "the data
        never arrived". The table is in the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py --cdp-endpoint "$MAKEMYTRIP_CDP_ENDPOINT" \
          --city Goa --checkin 2026-11-10 --checkout 2026-11-12 \
          --pages 3 --out goa
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        90 properties over 3 pages, all priced, as the site shows for Goa.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|beautifulsoup4|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true
