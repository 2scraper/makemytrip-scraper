name: Site changed / API broke
description: makemytrip.com changed its listing API and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth
        its own report because the fix is different from a code bug:
        something on makemytrip.com moved.

        Useful to know before filing: this repo reads no HTML for its rows.
        Every row comes from one JSON endpoint the site's own front end calls
        (`POST mapi.makemytrip.com/clientbackend/cg/search-hotels/DESKTOP/2`,
        documented in `product_parser.py`), so a break is almost always a
        renamed field, a request field the endpoint stopped accepting, a new
        experiment string (`expData`) without which prices come back null,
        or Akamai refusing what used to be served.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - The run stops with "The endpoint refused this request (...)"
        - 0 rows ("No Hotels Found") on a city that visibly has hotels on the site
        - Every price is null
        - A specific column is null or wrong on every row
        - Every run is blocked by akamai, even through a country-in Scraping Browser profile
        - Pagination stops after page 1 or repeats rows
        - Something else
    validations:
      required: true

  - type: input
    id: query
    attributes:
      label: Query
      description: The flags (or --url), and how the run reached the site.
      placeholder: "--city Goa --checkin 2026-11-10 --checkout 2026-11-12 --pages 3 (via --cdp-endpoint country-in)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Whichever of these you can get. A capture beats a description.

        - The response as the parser saw it: re-run with
          `--dump-html response.json` and paste the first record (it is JSON).
        - For a column problem: the value you got, and the value the site shows.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
